name: Check and deploy Lilt
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: litl-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and types
        run: |
          npm run format:check
          npm run typecheck
      - name: Test model, playback data and OBS relay
        run: npm test
      - name: Build Cloudflare Worker
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test production editor and standalone player
        env:
          TEST_URL: http://127.0.0.1:4173
        run: npm run test:browser
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Deploy to litl.andka.id
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '94d4dcf8ea96e76cfceac33c55833b40'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          npm run deploy -- --skip-build
