<!doctype html>
<html lang="en" class="h-full"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lilt · OBS player</title><link rel="stylesheet" href="/lilt/fonts.css"><link rel="stylesheet" href="/lilt/player.css"></head><body class="m-0 h-full overflow-hidden bg-transparent"><canvas class="block h-full w-full" id="stage" aria-label="Animated lyrics"></canvas><div class="absolute inset-x-6 bottom-6 bg-rose-950 p-4 font-sans text-sm whitespace-pre-wrap text-white empty:hidden" id="error" role="alert"></div><script type="module">
import Lilt from '/lilt/index.js';
const query=new URLSearchParams(location.search),error=document.getElementById('error');
try{
 const score=await (await fetch(query.get('score')||'/examples/score.json')).json();
 const player=new Lilt.Player(document.getElementById('stage'),Lilt.migrateV2(score),{
  transparent:query.get('transparent')!=='0',loop:query.get('loop')!=='0',
  channel:query.get('channel')||'lilt-studio',onError:e=>error.textContent=e.message
 });
 window.liltPlayer=player;
 await Promise.all([document.fonts.ready,player.renderer.ready()]);player.renderer.invalidate();player.seek(Number(query.get('time')||0));
 if(query.get('socket'))player.connectSocket(query.get('socket'));
 if(query.get('autoplay')!=='0')await player.play();
 // Optional parent control is same-origin only. OBS can instead use WebSocket.
 addEventListener('message',event=>{if(event.origin===location.origin)player.command(event.data);});
}catch(e){error.textContent=e.message;}
</script></body></html>
